name: build and upload documentation

on:
  push:
    branches:
      - main
      - 'missytake/docs-ci'
    paths:
      - 'doc/**'
      - 'scripts/build-docs.sh'
      - '.github/workflows/docs.yaml'

permissions: {}

jobs:
  scripts:
    name: build 
    runs-on: ubuntu-latest
    environment: 
      name: 'chatmail.at/doc/relay/'
      url: https://chatmail.at/doc/relay/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: initenv 
        run: scripts/initenv.sh

      - name: build documentation 
        working-directory: doc
        run: uv run --project .. --group docs sphinx-build source build

      - name: build documentation second time (for TOC)
        working-directory: doc
        run: uv run --project .. --group docs sphinx-build source build

      - name: check links 
        working-directory: doc
        run: uv run --project .. --group docs sphinx-build --builder linkcheck source build

      - name: upload documentation
        run: |
          mkdir -p "$HOME/.ssh"
          echo "${{ secrets.CHATMAIL_STAGING_SSHKEY }}" > "$HOME/.ssh/key"
          chmod 600 "$HOME/.ssh/key"
          rsync -rILvh -e "ssh -i $HOME/.ssh/key -o StrictHostKeyChecking=no" $GITHUB_WORKSPACE/doc/build/ "${{ secrets.USERNAME }}@chatmail.at:"

